<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 920" width="100%" height="100%" style="background-color: #FBF8F1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2D3748" />
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1A202C">Figure 3. Use Case Diagram - Learning Agreement Management (Core Domain)</text>
  <text x="30" y="50" font-size="11.5" fill="#5A4A3E">Tripartite Study Contract Authoring, ECTS Credit Validation, and Faculty Workflow Escalation</text>

  <!-- System Boundary Box -->
  <g transform="translate(230, 75)">
    <rect x="0" y="0" width="1000" height="800" rx="8" fill="#F7FAFC" stroke="#8D5B4C" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="1000" height="32" rx="8" fill="#FDF3E7" stroke="#8D5B4C" stroke-width="1" />
    <text x="500" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A3728">Learning Agreement Management Bounded Context</text>

    <!-- Column 1: Primary Use Cases (x = 130) -->
    <!-- U1: Create Draft LA -->
    <ellipse cx="140" cy="80" rx="100" ry="25" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="140" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Create Draft LA</text>

    <!-- U2: Manage Course Lines -->
    <ellipse cx="140" cy="160" rx="105" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="140" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Manage Course Lines</text>

    <!-- U5: Submit LA -->
    <ellipse cx="140" cy="245" rx="100" ry="25" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="140" y="249" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Submit LA</text>

    <!-- U9: Request Amendment -->
    <ellipse cx="140" cy="330" rx="105" ry="25" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="140" y="334" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Request Amendment</text>

    <!-- U10: Cancel LA -->
    <ellipse cx="140" cy="415" rx="100" ry="25" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="140" y="419" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Cancel LA</text>

    <!-- U11: Track LA Status -->
    <ellipse cx="140" cy="500" rx="100" ry="25" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="140" y="504" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Track LA Status</text>

    <!-- Column 2: Included & Extended Use Cases (x = 480) -->
    <!-- U3: Propose New Equivalence -->
    <ellipse cx="480" cy="160" rx="115" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="480" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Propose New Equivalence</text>

    <!-- U4: Check ECTS Balance -->
    <ellipse cx="480" cy="245" rx="115" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="480" y="249" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Check ECTS Balance</text>

    <!-- U7: Escalate Overdue Review -->
    <ellipse cx="480" cy="610" rx="115" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="480" y="614" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Escalate Overdue Review</text>

    <!-- Column 3: Review & Downstream Institutional Use Cases (x = 810) -->
    <!-- U6: Review LA -->
    <ellipse cx="810" cy="610" rx="110" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="810" y="614" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Review LA</text>

    <!-- U8: Notify Student of Decision -->
    <ellipse cx="810" cy="710" rx="125" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="810" y="714" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Notify Student of Decision</text>

    <!-- U12: Confirm LA at Host University -->
    <ellipse cx="810" cy="500" rx="135" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="810" y="504" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Confirm LA at Host University</text>

    <!-- Relationships inside System Boundary -->
    <!-- U3 extends U2 -->
    <line x1="365" y1="160" x2="245" y2="160" stroke="#2D3748" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)" />
    <text x="305" y="152" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«extend»</text>

    <!-- Note on extend U3 ..> U2 -->
    <rect x="235" y="105" width="140" height="35" rx="3" fill="#FEFCBF" stroke="#D69E2E" stroke-width="0.8" />
    <text x="305" y="120" text-anchor="middle" font-size="8.5" fill="#744210">[no equivalence</text>
    <text x="305" y="132" text-anchor="middle" font-size="8.5" fill="#744210">found in catalog]</text>

    <!-- U5 includes U4 -->
    <line x1="240" y1="245" x2="365" y2="245" stroke="#2D3748" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)" />
    <text x="302" y="238" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«include»</text>

    <!-- U7 extends U6 -->
    <line x1="595" y1="610" x2="700" y2="610" stroke="#2D3748" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)" />
    <text x="648" y="602" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«extend»</text>

    <!-- Note on extend U7 ..> U6 -->
    <rect x="580" y="555" width="140" height="35" rx="3" fill="#FEFCBF" stroke="#D69E2E" stroke-width="0.8" />
    <text x="650" y="570" text-anchor="middle" font-size="8.5" fill="#744210">[no decision within</text>
    <text x="650" y="582" text-anchor="middle" font-size="8.5" fill="#744210">5 business days]</text>

    <!-- U6 includes U8 -->
    <line x1="810" y1="636" x2="810" y2="684" stroke="#2D3748" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)" />
    <text x="835" y="663" font-size="9" font-style="italic" fill="#7A583A">«include»</text>
  </g>

  <!-- ACTORS (Left) -->
  <!-- Actor 1: Student -->
  <g transform="translate(60, 240)">
    <circle cx="30" cy="14" r="10" fill="#FFF9F2" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="24" x2="30" y2="52" stroke="#2D3748" stroke-width="1.5" />
    <line x1="12" y1="34" x2="48" y2="34" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="16" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="44" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <text x="30" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">Student</text>
  </g>

  <!-- Actor 2: Scheduler (Timer) -->
  <g transform="translate(60, 640)">
    <circle cx="30" cy="14" r="10" fill="#FFF9F2" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="24" x2="30" y2="52" stroke="#2D3748" stroke-width="1.5" />
    <line x1="12" y1="34" x2="48" y2="34" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="16" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="44" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <text x="30" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">Scheduler</text>
    <text x="30" y="106" text-anchor="middle" font-size="9" fill="#7A583A">(Temporal Trigger)</text>
  </g>

  <!-- ACTORS (Right) -->
  <!-- Actor 3: Home Academic Coordinator -->
  <g transform="translate(1330, 640)">
    <circle cx="30" cy="14" r="10" fill="#FFF9F2" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="24" x2="30" y2="52" stroke="#2D3748" stroke-width="1.5" />
    <line x1="12" y1="34" x2="48" y2="34" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="16" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="44" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <text x="30" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">Home Academic</text>
    <text x="30" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1A202C">Coordinator</text>
  </g>

  <!-- Actor 4: Host Institutional Coordinator -->
  <g transform="translate(1330, 440)">
    <circle cx="30" cy="14" r="10" fill="#FFF9F2" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="24" x2="30" y2="52" stroke="#2D3748" stroke-width="1.5" />
    <line x1="12" y1="34" x2="48" y2="34" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="16" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="44" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <text x="30" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">Host Coordinator</text>
    <text x="30" y="106" text-anchor="middle" font-size="9" fill="#7A583A">(external, secondary)</text>
  </g>

  <!-- Actor to Use Case Connections (Straight, Clean Lines) -->
  <!-- Student -> U1, U2, U5, U9, U10, U11 -->
  <line x1="105" y1="260" x2="270" y2="155" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="105" y1="270" x2="265" y2="235" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="105" y1="280" x2="270" y2="320" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="105" y1="290" x2="270" y2="405" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="105" y1="300" x2="270" y2="490" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="105" y1="250" x2="270" y2="575" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />

  <!-- Scheduler -> U7 -->
  <line x1="105" y1="680" x2="600" y2="685" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />

  <!-- Home Academic Coordinator -> U6 -->
  <line x1="1330" y1="685" x2="1150" y2="685" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />

  <!-- Host Coordinator -> U12 -->
  <line x1="1330" y1="485" x2="1175" y2="575" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
</svg>