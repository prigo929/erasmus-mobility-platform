<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1100" width="100%" height="100%" style="background-color: #FBF8F1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2D3748" />
    </marker>
    <marker id="impl-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,1 11,6 0,11" fill="#FFFFFF" stroke="#2D3748" stroke-width="1.5" />
    </marker>
    <marker id="diamond" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="12" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,5 8,1 16,5 8,9" fill="#1A202C" />
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#1A202C">Figure 10. Four-Layer Architecture for Supporting Subdomain (Equivalence Management)</text>
  <text x="30" y="58" font-size="12.5" fill="#5A4A3E">Separation of Concerns: Controller Endpoint, Application Service, Domain Repository, and JPA Infrastructure</text>

  <!-- Outer Bounded Context Box -->
  <g transform="translate(25, 75)">
    <rect x="0" y="0" width="1430" height="1000" rx="6" fill="#FBF6ED" stroke="#8D5B4C" stroke-width="1.8" filter="url(#shadow)" />
    <path d="M 0 0 L 370 0 L 370 26 L 355 34 L 0 34 Z" fill="#EFE5D5" stroke="#8D5B4C" stroke-width="1.2" />
    <text x="15" y="22" font-size="12" font-weight="bold" fill="#4A3728">Equivalence Management Bounded Context</text>

    <!-- 1. USER INTERFACE LAYER -->
    <g transform="translate(340, 45)">
      <rect x="0" y="0" width="380" height="155" rx="6" fill="#FDFBF7" stroke="#8D5B4C" stroke-width="1.4" />
      <path d="M 0 0 L 170 0 L 170 20 L 160 26 L 0 26 Z" fill="#EFE5D5" stroke="#8D5B4C" stroke-width="1" />
      <text x="10" y="16" font-size="10" font-weight="bold" fill="#4A3728">User Interface Layer</text>

      <!-- Controller -->
      <g transform="translate(20, 35)">
        <rect x="0" y="0" width="340" height="105" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.2" />
        <circle cx="16" cy="16" r="6" fill="#84CC16" />
        <text x="16" y="19" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">C</text>
        <text x="170" y="14" text-anchor="middle" font-size="8.5" font-style="italic" fill="#7A583A">«Controller»</text>
        <text x="170" y="26" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">EquivalenceCtrl</text>
        <line x1="0" y1="32" x2="340" y2="32" stroke="#8D5B4C" stroke-width="0.8" />
        <text x="10" y="46" font-size="8.5" fill="#2D3748">- appService: EquivalenceApplicationService</text>
        <line x1="0" y1="52" x2="340" y2="52" stroke="#8D5B4C" stroke-width="0.8" />
        <text x="10" y="66" font-size="8.5" fill="#2D3748">+ searchEquivalences(query: SearchDTO): ResponseEntity</text>
        <text x="10" y="79" font-size="8.5" fill="#2D3748">+ registerEquivalence(req: RegisterDTO): ResponseEntity</text>
        <text x="10" y="92" font-size="8.5" fill="#2D3748">+ evaluateProposal(id: UUID, req: EvalDTO): ResponseEntity</text>
      </g>
    </g>

    <!-- Arrow from UI Layer down to Application Layer -->
    <line x1="530" y1="200" x2="530" y2="255" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="540" y="230" font-size="9.5" font-style="italic" fill="#7A583A">delegates</text>

    <!-- 2. APPLICATION LAYER -->
    <g transform="translate(50, 255)">
      <rect x="0" y="0" width="520" height="340" rx="6" fill="#FDFBF7" stroke="#8D5B4C" stroke-width="1.4" />
      <path d="M 0 0 L 150 0 L 150 20 L 140 26 L 0 26 Z" fill="#EFE5D5" stroke="#8D5B4C" stroke-width="1" />
      <text x="10" y="16" font-size="10" font-weight="bold" fill="#4A3728">Application Layer</text>

      <!-- Application Service -->
      <g transform="translate(20, 35)">
        <rect x="0" y="0" width="480" height="145" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" />
        <circle cx="18" cy="18" r="7" fill="#84CC16" />
        <text x="18" y="22" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">C</text>
        <text x="240" y="16" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«Application Service»</text>
        <text x="240" y="29" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1A202C">EquivalenceApplicationService</text>
        <line x1="0" y1="36" x2="480" y2="36" stroke="#8D5B4C" stroke-width="0.8" />
        <text x="12" y="50" font-size="8.5" fill="#2D3748">- equivalenceRepo: AcademicEquivalenceRepo</text>
        <text x="12" y="63" font-size="8.5" fill="#2D3748">- auditPort: AuditLogPort</text>
        <line x1="0" y1="70" x2="480" y2="70" stroke="#8D5B4C" stroke-width="0.8" />
        <text x="12" y="84" font-size="8.5" fill="#2D3748">+ registerEquivalence(cmd: RegisterCommand): UUID</text>
        <text x="12" y="97" font-size="8.5" fill="#2D3748">+ evaluateProposal(cmd: EvaluateProposalCommand): void</text>
        <text x="12" y="110" font-size="8.5" fill="#2D3748">+ retireEquivalence(cmd: RetireEquivalenceCommand): void</text>
        <text x="12" y="123" font-size="8" font-style="italic" fill="#7A583A">[Enforces: Validate ECTS range -&gt; Mutate state -&gt; Audit Log]</text>
      </g>

      <!-- Port: AuditLogPort -->
      <g transform="translate(130, 235)">
        <rect x="0" y="0" width="260" height="65" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.2" />
        <circle cx="14" cy="15" r="6" fill="#3B82F6" />
        <text x="14" y="18" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">I</text>
        <text x="130" y="14" text-anchor="middle" font-size="8.5" font-style="italic" fill="#7A583A">«Port»</text>
        <text x="130" y="26" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1A202C">AuditLogPort</text>
        <line x1="0" y1="32" x2="260" y2="32" stroke="#8D5B4C" stroke-width="0.8" />
        <text x="10" y="46" font-size="8.5" fill="#2D3748">+ logAction(action: String, entityId: UUID): void</text>
      </g>
    </g>

    <!-- 3. INFRASTRUCTURE LAYER -->
    <g transform="translate(600, 255)">
      <rect x="0" y="0" width="800" height="135" rx="6" fill="#FDFBF7" stroke="#8D5B4C" stroke-width="1.4" />
      <path d="M 0 0 L 160 0 L 160 20 L 150 26 L 0 26 Z" fill="#EFE5D5" stroke="#8D5B4C" stroke-width="1" />
      <text x="10" y="16" font-size="10" font-weight="bold" fill="#4A3728">Infrastructure Layer</text>

      <!-- AcademicEquivalenceRepoJPA -->
      <g transform="translate(30, 35)">
        <rect x="0" y="0" width="340" height="85" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.2" />
        <circle cx="14" cy="15" r="6" fill="#84CC16" />
        <text x="14" y="18" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">C</text>
        <text x="170" y="24" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A202C">AcademicEquivalenceRepoJPA</text>
        <line x1="0" y1="32" x2="340" y2="32" stroke="#8D5B4C" stroke-width="0.8" />
        <text x="10" y="46" font-size="8.5" fill="#2D3748">+ save(eq: AcademicEquivalence): void</text>
        <text x="10" y="59" font-size="8.5" fill="#2D3748">+ findById(id: UUID): Optional&lt;AcademicEquivalence&gt;</text>
        <text x="10" y="72" font-size="8.5" fill="#2D3748">+ searchByPartner(pid: String, code: String): List&lt;EQ&gt;</text>
      </g>

      <!-- AuditLogServiceJPA -->
      <g transform="translate(420, 35)">
        <rect x="0" y="0" width="340" height="85" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.2" />
        <circle cx="14" cy="15" r="6" fill="#84CC16" />
        <text x="14" y="18" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">C</text>
        <text x="170" y="24" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A202C">AuditLogServiceJPA</text>
        <line x1="0" y1="32" x2="340" y2="32" stroke="#8D5B4C" stroke-width="0.8" />
        <text x="10" y="46" font-size="8.5" fill="#2D3748">+ logAction(action: String, entityId: UUID): void</text>
        <text x="10" y="60" font-size="8" fill="#7A583A">- persists to AUDIT_TRAIL append-only ledger</text>
      </g>
    </g>

    <!-- 4. DOMAIN LAYER -->
    <g transform="translate(50, 630)">
      <rect x="0" y="0" width="1350" height="340" rx="6" fill="#FDFBF7" stroke="#8D5B4C" stroke-width="1.4" />
      <path d="M 0 0 L 130 0 L 130 20 L 120 26 L 0 26 Z" fill="#EFE5D5" stroke="#8D5B4C" stroke-width="1" />
      <text x="10" y="16" font-size="10" font-weight="bold" fill="#4A3728">Domain Layer</text>

      <!-- AcademicEquivalenceRepo (Domain Interface) -->
      <g transform="translate(40, 40)">
        <rect x="0" y="0" width="320" height="95" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" />
        <circle cx="16" cy="16" r="6" fill="#3B82F6" />
        <text x="16" y="19" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">I</text>
        <text x="160" y="14" text-anchor="middle" font-size="8.5" font-style="italic" fill="#7A583A">«Repository»</text>
        <text x="160" y="26" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">AcademicEquivalenceRepo</text>
        <line x1="0" y1="32" x2="320" y2="32" stroke="#8D5B4C" stroke-width="0.8" />
        <text x="10" y="46" font-size="8.5" fill="#2D3748">+ save(eq: AcademicEquivalence): void</text>
        <text x="10" y="60" font-size="8.5" fill="#2D3748">+ findById(id: UUID): Optional&lt;AcademicEquivalence&gt;</text>
        <text x="10" y="74" font-size="8.5" fill="#2D3748">+ searchByPartner(pid: String, code: String): List&lt;EQ&gt;</text>
      </g>

      <!-- AcademicEquivalence Aggregate Root -->
      <g transform="translate(420, 40)">
        <rect x="0" y="0" width="380" height="205" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.6" />
        <circle cx="18" cy="18" r="7" fill="#84CC16" />
        <text x="18" y="22" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">C</text>
        <text x="190" y="16" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«Aggregate Root»</text>
        <text x="190" y="29" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A202C">AcademicEquivalence</text>
        <line x1="0" y1="36" x2="380" y2="36" stroke="#8D5B4C" stroke-width="0.8" />
        <text x="10" y="50" font-size="8.5" fill="#2D3748">- id: UUID</text>
        <text x="10" y="64" font-size="8.5" fill="#2D3748">- partnerUniversityId: String</text>
        <text x="10" y="78" font-size="8.5" fill="#2D3748">- hostCourseCode: String</text>
        <text x="10" y="92" font-size="8.5" fill="#2D3748">- homeCourseCode: String</text>
        <text x="10" y="106" font-size="8.5" fill="#2D3748">- credits: ECTSCredits</text>
        <text x="10" y="120" font-size="8.5" fill="#2D3748">- syllabus: CourseSyllabus</text>
        <text x="10" y="134" font-size="8.5" fill="#2D3748">- status: EquivalenceStatus</text>
        <line x1="0" y1="140" x2="380" y2="140" stroke="#8D5B4C" stroke-width="0.8" />
        <text x="10" y="154" font-size="8.5" fill="#2D3748">+ evaluateSyllabus(committeeNotes: String): void</text>
        <text x="10" y="168" font-size="8.5" fill="#2D3748">+ approve(evaluatorId: String): void</text>
        <text x="10" y="182" font-size="8.5" fill="#2D3748">+ retire(): void</text>
        <text x="10" y="196" font-size="8" font-style="italic" fill="#7A583A">[Aggregate Boundary guarantees verified curricular mappings]</text>
      </g>

      <!-- Value Object: CourseSyllabus -->
      <g transform="translate(850, 40)">
        <rect x="0" y="0" width="240" height="105" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.2" />
        <circle cx="14" cy="15" r="6" fill="#84CC16" />
        <text x="14" y="18" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">C</text>
        <text x="120" y="14" text-anchor="middle" font-size="8.5" font-style="italic" fill="#7A583A">«Value Object»</text>
        <text x="120" y="26" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A202C">CourseSyllabus</text>
        <line x1="0" y1="32" x2="240" y2="32" stroke="#8D5B4C" stroke-width="0.8" />
        <text x="10" y="46" font-size="8.5" fill="#2D3748">- learningOutcomes: String</text>
        <text x="10" y="59" font-size="8.5" fill="#2D3748">- weeklyHours: int</text>
        <text x="10" y="72" font-size="8.5" fill="#2D3748">- thematicUnits: String</text>
        <text x="10" y="85" font-size="8.5" fill="#2D3748">- gradingCriteria: String</text>
      </g>
      <path d="M 800 90 L 850 90" stroke="#1A202C" stroke-width="1.2" marker-start="url(#diamond)" />

      <!-- Enum: EquivalenceStatus -->
      <g transform="translate(850, 160)">
        <rect x="0" y="0" width="240" height="105" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.2" />
        <circle cx="14" cy="15" r="6" fill="#EA580C" />
        <text x="14" y="18" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">E</text>
        <text x="120" y="14" text-anchor="middle" font-size="8.5" font-style="italic" fill="#7A583A">«Enum»</text>
        <text x="120" y="26" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A202C">EquivalenceStatus</text>
        <line x1="0" y1="32" x2="240" y2="32" stroke="#8D5B4C" stroke-width="0.8" />
        <text x="10" y="46" font-size="8.5" fill="#2D3748">PROPOSED | UNDER_EVALUATION</text>
        <text x="10" y="60" font-size="8.5" fill="#2D3748">APPROVED | ACTIVE | RETIRED</text>
      </g>
      <line x1="800" y1="190" x2="850" y2="190" stroke="#2D3748" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" />
    </g>

    <!-- ARCHITECTURAL CROSS-LAYER CONNECTORS -->
    <!-- AppService to Domain Repo (load / save) -->
    <path d="M 200 400 L 200 645" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="210" y="585" font-size="9" font-weight="bold" fill="#1A202C">load / save</text>

    <!-- AppService to Aggregate Root (mutates state) -->
    <path d="M 500 400 L 500 645" stroke="#2D3748" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" />
    <text x="510" y="585" font-size="9" font-weight="bold" fill="#9C4221">mutates state</text>

    <!-- AppService to Audit Port -->
    <path d="M 300 435 L 300 490" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="310" y="465" font-size="8.5" font-weight="bold" fill="#2B6CB0">audit logging</text>

    <!-- Infrastructure implementations (Dashed lines with hollow triangles) -->
    <!-- JPA implements Domain Repo -->
    <path d="M 770 375 L 770 540 L 250 540 L 250 645" stroke="#2D3748" stroke-width="1.3" stroke-dasharray="4,4" fill="none" marker-end="url(#impl-arrow)" />
    <text x="510" y="535" font-size="9" font-style="italic" fill="#7A583A">implements</text>

    <!-- AuditLogService implements AuditPort (enters clean right edge) -->
    <path d="M 1150 375 L 1150 522 L 440 522" stroke="#2D3748" stroke-width="1.3" stroke-dasharray="4,4" fill="none" marker-end="url(#impl-arrow)" />
    <text x="455" y="515" font-size="9" font-style="italic" fill="#7A583A">implements</text>
  </g>
</svg>