<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="100%" height="100%" style="background-color: #FBF8F1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2D3748" />
    </marker>
    <marker id="ret-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#718096" />
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-opacity="0.10" />
    </filter>
  </defs>

  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1A202C">Figure 23. Sequence Diagram: Synchronous REST Integration - Server Side (Equivalence Management Context)</text>
  <text x="30" y="50" font-size="11.5" fill="#5A4A3E">Author: Bîrgovan A. Mihai-Daniel. Open Host Service REST Endpoint Processing Inbound Catalog Verification Request</text>

  <!-- Lifeline Headers -->
  <!-- 1. Remote Client (Learning Agreement) -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="180" height="45" rx="5" fill="#EBF8FF" stroke="#3182CE" stroke-width="1.5" filter="url(#shadow)" />
    <text x="90" y="27" text-anchor="middle" font-size="11" font-weight="bold" fill="#2B6CB0">Agreement Client</text>
    <line x1="90" y1="45" x2="90" y2="820" stroke="#63B3ED" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- 2. Controller :EquivalenceApiRest (Open Host Service) -->
  <g transform="translate(280, 75)">
    <rect x="0" y="0" width="220" height="45" rx="5" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.5" filter="url(#shadow)" />
    <text x="110" y="27" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">:EquivalenceApiRest</text>
    <line x1="110" y1="45" x2="110" y2="820" stroke="#CBD5E0" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- 3. Service :EquivalenceApplicationService -->
  <g transform="translate(560, 75)">
    <rect x="0" y="0" width="230" height="45" rx="5" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.5" filter="url(#shadow)" />
    <text x="115" y="27" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">:EquivalenceAppService</text>
    <line x1="115" y1="45" x2="115" y2="820" stroke="#CBD5E0" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- 4. Domain Port :AcademicEquivalenceRepository -->
  <g transform="translate(850, 75)">
    <rect x="0" y="0" width="220" height="45" rx="5" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.5" filter="url(#shadow)" />
    <text x="110" y="27" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">:EquivalenceRepository</text>
    <line x1="110" y1="45" x2="110" y2="820" stroke="#CBD5E0" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- 5. Aggregate :AcademicEquivalence -->
  <g transform="translate(1120, 75)">
    <rect x="0" y="0" width="200" height="45" rx="5" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.5" filter="url(#shadow)" />
    <text x="100" y="27" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">eq:AcademicEquivalence</text>
    <line x1="100" y1="45" x2="100" y2="820" stroke="#CBD5E0" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- 6. Database :PostgreSQL -->
  <g transform="translate(1380, 75)">
    <rect x="0" y="0" width="160" height="45" rx="5" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.5" filter="url(#shadow)" />
    <text x="80" y="27" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">db:PostgreSQL</text>
    <line x1="80" y1="45" x2="80" y2="820" stroke="#A0AEC0" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- Activation Boxes -->
  <rect x="125" y="140" width="10" height="640" fill="#BEE3F8" stroke="#3182CE" stroke-width="1" />
  <rect x="385" y="150" width="10" height="610" fill="#FFF8EE" stroke="#8D5B4C" stroke-width="1" />
  <rect x="670" y="180" width="10" height="540" fill="#FFF8EE" stroke="#8D5B4C" stroke-width="1" />
  <rect x="955" y="220" width="10" height="260" fill="#FFF8EE" stroke="#8D5B4C" stroke-width="1" />
  <rect x="1215" y="380" width="10" height="150" fill="#FFF8EE" stroke="#8D5B4C" stroke-width="1" />
  <rect x="1455" y="250" width="10" height="180" fill="#E2E8F0" stroke="#4A5568" stroke-width="1" />

  <!-- Messages -->
  <!-- 1. Remote Client -> Open Host Service Controller -->
  <line x1="135" y1="150" x2="385" y2="150" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="260" y="142" font-size="9" text-anchor="middle" font-weight="bold" fill="#2B6CB0">HTTP GET /api/equivalences/search?send=CS101&amp;host=INF202</text>

  <!-- 2. Controller -> Application Service -->
  <line x1="395" y1="180" x2="670" y2="180" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="532" y="172" font-size="9" text-anchor="middle" font-weight="bold" fill="#2D3748">checkEquivalence("CS101", "INF202")</text>

  <!-- 3. Service -> Repository Port -->
  <line x1="680" y1="220" x2="955" y2="220" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="817" y="212" font-size="8.5" text-anchor="middle" font-weight="bold" fill="#2D3748">findByCourseCodes("CS101", "INF202")</text>

  <!-- 4. Repo -> Database (JPQL Query) -->
  <line x1="965" y1="250" x2="1455" y2="250" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="1210" y="242" font-size="8.5" text-anchor="middle" fill="#4A5568">SELECT e FROM AcademicEquivalence e WHERE ...</text>

  <!-- 5. Database -> Repo (Tuple data) -->
  <line x1="1455" y1="330" x2="965" y2="330" stroke="#718096" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ret-arrow)" />
  <text x="1210" y="322" font-size="8.5" text-anchor="middle" fill="#4A5568">return raw tuple [id, status, sendCredits, hostCredits, dates]</text>

  <!-- 6. Repo instantiates Aggregate -->
  <line x1="965" y1="380" x2="1215" y2="380" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="1090" y="372" font-size="8.5" text-anchor="middle" font-weight="bold" fill="#2D3748">hydrate entity AcademicEquivalence</text>

  <!-- 7. Repo returns aggregate to Service -->
  <line x1="955" y1="460" x2="680" y2="460" stroke="#718096" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ret-arrow)" />
  <text x="817" y="452" font-size="8.5" text-anchor="middle" fill="#4A5568">return Optional&lt;AcademicEquivalence&gt;</text>

  <!-- 8. Service validates domain state with Aggregate -->
  <line x1="680" y1="490" x2="1215" y2="490" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="947" y="482" font-size="8.5" text-anchor="middle" font-weight="bold" fill="#2D3748">isCurrentlyValid(today)</text>

  <line x1="1215" y1="525" x2="680" y2="525" stroke="#718096" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ret-arrow)" />
  <text x="947" y="517" font-size="8.5" text-anchor="middle" fill="#4A5568">return (status == ACTIVE &amp;&amp; withinValidityWindow)</text>

  <!-- 9. Service constructs Result -->
  <path d="M 680 550 L 730 550 L 730 580 L 680 580" fill="none" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <text x="737" y="568" font-size="8" fill="#4A5568">createEquivalenceCheckResult(valid=true, credits=6)</text>

  <!-- 10. Service -> Controller -->
  <line x1="670" y1="640" x2="395" y2="640" stroke="#718096" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ret-arrow)" />
  <text x="532" y="632" font-size="8.5" text-anchor="middle" fill="#4A5568">return EquivalenceCheckResult</text>

  <!-- 11. Controller maps to Published Language DTO & serializes JSON -->
  <path d="M 395 660 L 445 660 L 445 690 L 395 690" fill="none" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <text x="452" y="678" font-size="8" fill="#4A5568">serializeToEquivalenceResponseDTO()</text>

  <!-- 12. Controller -> Remote Client (HTTP 200 OK) -->
  <line x1="385" y1="740" x2="135" y2="740" stroke="#2B6CB0" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ret-arrow)" />
  <text x="260" y="732" font-size="9" text-anchor="middle" font-weight="bold" fill="#2B6CB0">HTTP 200 OK {equivalenceId: "...", recognizedCredits: 6, status: "ACTIVE"}</text>

  <!-- Note Box -->
  <g transform="translate(60, 840)">
    <rect x="0" y="0" width="1480" height="75" rx="4" fill="#FEFCBF" stroke="#D69E2E" stroke-width="1" />
    <text x="16" y="20" font-size="9.5" font-weight="bold" fill="#744210">Open Host Service &amp; Published Language (OHS / PL Pattern)</text>
    <text x="16" y="38" font-size="8.5" fill="#744210">1. EquivalenceApiRest exposes standardized JSON endpoints, isolating internal database schemas from external consumers.</text>
    <text x="16" y="54" font-size="8.5" fill="#744210">2. Aggregate root verifies validity window and active status before credits are confirmed, protecting academic integrity.</text>
  </g>
</svg>