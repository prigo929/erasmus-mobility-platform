<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 860" width="100%" height="100%" style="background-color: #FBF8F1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2D3748" />
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C53030" />
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1A202C">Figure 21. State Machine Diagram: ChecklistTask Aggregate Lifecycle</text>
  <text x="30" y="50" font-size="11.5" fill="#5A4A3E">Author: Schipor Ana-Maria (Student 3). Asynchronous Triggering, Document Proof Verification, and Overdue Escalation</text>

  <!-- Initial State Node -->
  <circle cx="70" cy="150" r="12" fill="#1A202C" />
  <line x1="82" y1="150" x2="135" y2="150" stroke="#2D3748" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="108" y="142" font-size="8.5" text-anchor="middle" fill="#2D3748">instantiate()</text>

  <!-- State 1: INITIALIZED -->
  <g transform="translate(140, 100)">
    <rect x="0" y="0" width="230" height="100" rx="10" fill="#FFF8EE" stroke="#8D5B4C" stroke-width="1.6" filter="url(#shadow)" />
    <text x="115" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A202C">INITIALIZED</text>
    <line x1="0" y1="34" x2="230" y2="34" stroke="#8D5B4C" stroke-width="0.8" />
    <text x="10" y="52" font-size="9" fill="#7A583A">entry / computeDeadline()</text>
    <text x="10" y="68" font-size="8.5" fill="#2D3748">Generated automatically upon</text>
    <text x="10" y="82" font-size="8.5" fill="#2D3748">AgreementApproved message</text>
  </g>

  <!-- Transition INITIALIZED -> PENDING_STUDENT_ACTION -->
  <line x1="370" y1="150" x2="455" y2="150" stroke="#2D3748" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="412" y="142" font-size="8.5" text-anchor="middle" fill="#2D3748">assignToStudent()</text>

  <!-- State 2: PENDING_STUDENT_ACTION -->
  <g transform="translate(460, 90)">
    <rect x="0" y="0" width="270" height="120" rx="10" fill="#FFF8EE" stroke="#8D5B4C" stroke-width="1.6" filter="url(#shadow)" />
    <text x="135" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A202C">PENDING_STUDENT_ACTION</text>
    <line x1="0" y1="34" x2="270" y2="34" stroke="#8D5B4C" stroke-width="0.8" />
    <text x="10" y="52" font-size="9" fill="#7A583A">entry / sendReminderEmail()</text>
    <text x="10" y="68" font-size="8.5" fill="#2D3748">Awaiting student action: health insurance,</text>
    <text x="10" y="82" font-size="8.5" fill="#2D3748">grant agreement, housing form</text>
    <text x="10" y="100" font-size="8.5" font-weight="bold" fill="#C53030">after(deadline) / flagOverdue()</text>
  </g>

  <!-- Transition PENDING_STUDENT_ACTION -> SUBMITTED_FOR_VERIFICATION -->
  <line x1="730" y1="150" x2="825" y2="150" stroke="#2D3748" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="777" y="142" font-size="8.5" text-anchor="middle" font-weight="bold" fill="#2D3748">uploadProof(file)</text>

  <!-- State 3: SUBMITTED_FOR_VERIFICATION -->
  <g transform="translate(830, 90)">
    <rect x="0" y="0" width="280" height="120" rx="10" fill="#FFF8EE" stroke="#8D5B4C" stroke-width="1.6" filter="url(#shadow)" />
    <text x="140" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A202C">SUBMITTED_FOR_VERIFICATION</text>
    <line x1="0" y1="34" x2="280" y2="34" stroke="#8D5B4C" stroke-width="0.8" />
    <text x="10" y="52" font-size="9" fill="#7A583A">entry / queueForOfficerReview()</text>
    <text x="10" y="68" font-size="8.5" fill="#2D3748">Document proof uploaded.</text>
    <text x="10" y="82" font-size="8.5" fill="#2D3748">Erasmus office checks compliance</text>
    <text x="10" y="98" font-size="8.5" fill="#2D3748">and institutional validity.</text>
  </g>

  <!-- Loopback for Document Rejection: SUBMITTED -> PENDING -->
  <path d="M 880 210 L 880 240 L 595 240 L 595 210" fill="none" stroke="#C53030" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#red-arrow)" />
  <text x="737" y="232" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#C53030">rejectProof(rejectionNotes)</text>

  <!-- Transition SUBMITTED -> COMPLETED -->
  <line x1="1110" y1="150" x2="1205" y2="150" stroke="#2D3748" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="1157" y="142" font-size="8.5" text-anchor="middle" font-weight="bold" fill="#2D3748">validateProof()</text>

  <!-- State 4: COMPLETED (Top Right) -->
  <g transform="translate(1210, 90)">
    <rect x="0" y="0" width="260" height="120" rx="10" fill="#FFF8EE" stroke="#8D5B4C" stroke-width="1.6" filter="url(#shadow)" />
    <text x="130" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A202C">COMPLETED</text>
    <line x1="0" y1="34" x2="260" y2="34" stroke="#8D5B4C" stroke-width="0.8" />
    <text x="10" y="52" font-size="9" fill="#7A583A">entry / checkAllChecklistTasks()</text>
    <text x="10" y="68" font-size="8.5" fill="#2D3748">Task requirements satisfied.</text>
    <text x="10" y="82" font-size="8.5" fill="#2D3748">Advances departure readiness.</text>
    <text x="10" y="98" font-size="8.5" fill="#2D3748">Unlocks grant disbursement.</text>
  </g>

  <!-- State 5: OVERDUE (Bottom Center) -->
  <g transform="translate(460, 390)">
    <rect x="0" y="0" width="270" height="110" rx="10" fill="#FFF5F5" stroke="#C53030" stroke-width="1.6" filter="url(#shadow)" />
    <text x="135" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#9B2C2C">OVERDUE</text>
    <line x1="0" y1="34" x2="270" y2="34" stroke="#C53030" stroke-width="0.8" />
    <text x="10" y="52" font-size="9" fill="#C53030">entry / sendUrgentEscalation()</text>
    <text x="10" y="68" font-size="8.5" fill="#9B2C2C">Deadline elapsed without upload.</text>
    <text x="10" y="82" font-size="8.5" fill="#9B2C2C">Coordinator notified automatically.</text>
  </g>

  <!-- Transition PENDING -> OVERDUE (Temporal) -->
  <line x1="530" y1="210" x2="530" y2="390" stroke="#C53030" stroke-width="1.6" marker-end="url(#red-arrow)" />
  <text x="540" y="300" font-size="8.5" font-weight="bold" fill="#C53030">after(deadline)</text>

  <!-- Recovery Transition OVERDUE -> SUBMITTED_FOR_VERIFICATION -->
  <path d="M 730 445 L 970 445 L 970 210" fill="none" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="850" y="437" font-size="8.5" font-weight="bold" fill="#2D3748">uploadLateProof(file)</text>

  <!-- State 6: ABANDONED (Bottom Left / Terminal) -->
  <g transform="translate(140, 480)">
    <rect x="0" y="0" width="240" height="90" rx="10" fill="#FFF5F5" stroke="#C53030" stroke-width="1.6" filter="url(#shadow)" />
    <text x="120" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#9B2C2C">ABANDONED</text>
    <line x1="0" y1="34" x2="240" y2="34" stroke="#C53030" stroke-width="0.8" />
    <text x="10" y="52" font-size="9" fill="#C53030">entry / markChecklistVoid()</text>
    <text x="10" y="68" font-size="8.5" fill="#9B2C2C">Mobility withdrawn or cancelled.</text>
  </g>

  <!-- Cancel transitions to ABANDONED -->
  <line x1="200" y1="200" x2="200" y2="480" stroke="#C53030" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#red-arrow)" />
  <text x="160" y="340" font-size="8.5" font-weight="bold" fill="#C53030">abandon()</text>

  <!-- Terminal Final Nodes -->
  <circle cx="260" cy="640" r="14" fill="none" stroke="#1A202C" stroke-width="2" />
  <circle cx="260" cy="640" r="8" fill="#1A202C" />
  <line x1="260" y1="570" x2="260" y2="626" stroke="#2D3748" stroke-width="1.6" marker-end="url(#arrow)" />

  <circle cx="1340" cy="300" r="14" fill="none" stroke="#1A202C" stroke-width="2" />
  <circle cx="1340" cy="300" r="8" fill="#1A202C" />
  <line x1="1340" y1="210" x2="1340" y2="286" stroke="#2D3748" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Java Enum Specification Note Box (Bottom Right) -->
  <g transform="translate(850, 560)">
    <rect x="0" y="0" width="630" height="200" rx="4" fill="#FEFCBF" stroke="#D69E2E" stroke-width="1" />
    <path d="M 620 0 L 630 10 L 620 10 Z" fill="#B7791F" />
    <text x="16" y="24" font-size="10.5" font-weight="bold" fill="#744210">Java Enum Definition &amp; Lifecycle Management Rules</text>
    <text x="16" y="48" font-size="9" fill="#744210">public enum TaskStatus {</text>
    <text x="30" y="66" font-size="9" fill="#744210">INITIALIZED, PENDING_STUDENT_ACTION, SUBMITTED_FOR_VERIFICATION,</text>
    <text x="30" y="84" font-size="9" fill="#744210">COMPLETED, OVERDUE, ABANDONED</text>
    <text x="16" y="102" font-size="9" fill="#744210">}</text>
    <text x="16" y="126" font-size="9" fill="#744210">1. Automatic Creation: Created asynchronously via AgreementApprovedEvent listener.</text>
    <text x="16" y="146" font-size="9" fill="#744210">2. Temporal Escalation: Scheduled cron scanner flags tasks past deadline as OVERDUE.</text>
    <text x="16" y="166" font-size="9" fill="#744210">3. Departure Gate: areMandatoryTasksComplete() requires zero pending/overdue tasks.</text>
    <text x="16" y="186" font-size="8.5" font-style="italic" fill="#8C5015">[Guarantees institutional compliance before student arrives at host institution]</text>
  </g>
</svg>