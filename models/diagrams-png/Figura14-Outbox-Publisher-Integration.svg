<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 660" width="100%" height="100%" style="background-color: #FBF8F1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2D3748" />
    </marker>
    <marker id="impl-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="0,1 11,6 0,11" fill="#FFF9F2" stroke="#2D3748" stroke-width="1.4" />
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1A202C">Figure 14. Asynchronous Outbox Integration - Producer Side (Learning Agreement Context)</text>
  <text x="30" y="50" font-size="11.5" fill="#5A4A3E">Transactional Outbox Pattern Guaranteeing At-Least-Once Domain Event Delivery via Single ACID Relational Commit</text>

  <!-- Application Layer Box -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="460" height="230" rx="6" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.2" />
    <text x="14" y="22" font-size="12" font-weight="bold" fill="#4A5568">Application Layer: agreement.application</text>

    <!-- Class: AgreementApplicationService -->
    <g transform="translate(15, 38)">
      <rect x="0" y="0" width="430" height="175" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.5" filter="url(#shadow)" />
      <circle cx="16" cy="16" r="6" fill="#0EA5E9" />
      <text x="16" y="19" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">C</text>
      <text x="215" y="15" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«ApplicationService, @Transactional»</text>
      <text x="215" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">AgreementApplicationService</text>
      <line x1="0" y1="36" x2="430" y2="36" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="52" font-size="9" fill="#2D3748">- agreementRepo: LearningAgreementRepository</text>
      <text x="10" y="68" font-size="9" fill="#2D3748">- outboxRepo: IOutboxRepository</text>
      <text x="10" y="84" font-size="9" fill="#2D3748">- eventSerializer: EventJsonSerializer</text>
      <line x1="0" y1="92" x2="430" y2="92" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="108" font-size="9" fill="#2D3748">+ approveAgreement(id: UUID, coordinatorId: UUID): void</text>
      <text x="10" y="124" font-size="9" fill="#2D3748">+ submitAgreement(id: UUID): void</text>
      <text x="10" y="140" font-size="9" fill="#2D3748">+ rejectAgreement(id: UUID, reason: String): void</text>
      <text x="10" y="158" font-size="8.5" font-style="italic" fill="#7A583A">/* Commits Aggregate mutation and Outbox envelope atomically */</text>
    </g>
  </g>

  <!-- Domain Layer Box -->
  <g transform="translate(520, 80)">
    <rect x="0" y="0" width="460" height="230" rx="6" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.2" />
    <text x="14" y="22" font-size="12" font-weight="bold" fill="#4A5568">Domain Layer: agreement.domain</text>

    <!-- Class: LearningAgreementApprovedEvent -->
    <g transform="translate(15, 38)">
      <rect x="0" y="0" width="430" height="175" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.5" filter="url(#shadow)" />
      <circle cx="16" cy="16" r="6" fill="#EC4899" />
      <text x="16" y="19" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">E</text>
      <text x="215" y="15" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«DomainEvent»</text>
      <text x="215" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">LearningAgreementApprovedEvent</text>
      <line x1="0" y1="36" x2="430" y2="36" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="52" font-size="9" fill="#2D3748">- eventId: UUID</text>
      <text x="10" y="68" font-size="9" fill="#2D3748">- agreementId: UUID</text>
      <text x="10" y="84" font-size="9" fill="#2D3748">- studentId: UUID</text>
      <text x="10" y="100" font-size="9" fill="#2D3748">- hostUniversityId: UUID</text>
      <text x="10" y="116" font-size="9" fill="#2D3748">- approvedCredits: int</text>
      <text x="10" y="132" font-size="9" fill="#2D3748">- occurredOn: Instant</text>
      <line x1="0" y1="140" x2="430" y2="140" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="156" font-size="9" fill="#2D3748">+ getRoutingKey(): String = "agreement.approved"</text>
    </g>
  </g>

  <!-- Infrastructure Layer Box -->
  <g transform="translate(30, 340)">
    <rect x="0" y="0" width="950" height="280" rx="6" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.2" />
    <text x="14" y="22" font-size="12" font-weight="bold" fill="#4A5568">Infrastructure Layer: agreement.infrastructure.outbox</text>

    <!-- OutboxMessage -->
    <g transform="translate(15, 38)">
      <rect x="0" y="0" width="310" height="220" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.5" filter="url(#shadow)" />
      <circle cx="16" cy="16" r="6" fill="#F59E0B" />
      <text x="16" y="19" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">E</text>
      <text x="155" y="15" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«Entity, OutboxRecord»</text>
      <text x="155" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">OutboxMessage</text>
      <line x1="0" y1="36" x2="310" y2="36" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="52" font-size="9" fill="#2D3748">- id: UUID</text>
      <text x="10" y="68" font-size="9" fill="#2D3748">- aggregateType: String</text>
      <text x="10" y="84" font-size="9" fill="#2D3748">- aggregateId: UUID</text>
      <text x="10" y="100" font-size="9" fill="#2D3748">- eventType: String</text>
      <text x="10" y="116" font-size="9" fill="#2D3748">- payloadJson: String</text>
      <text x="10" y="132" font-size="9" fill="#2D3748">- status: OutboxStatus</text>
      <text x="10" y="148" font-size="9" fill="#2D3748">- createdAt: Instant</text>
      <text x="10" y="164" font-size="9" fill="#2D3748">- publishedAt: Instant</text>
      <line x1="0" y1="172" x2="310" y2="172" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="190" font-size="9" fill="#2D3748">+ markPublished(now: Instant): void</text>
      <text x="10" y="206" font-size="9" fill="#2D3748">+ markFailed(reason: String): void</text>
    </g>

    <!-- OutboxRepoJPA -->
    <g transform="translate(345, 38)">
      <rect x="0" y="0" width="300" height="220" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.5" filter="url(#shadow)" />
      <circle cx="16" cy="16" r="6" fill="#0EA5E9" />
      <text x="16" y="19" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">C</text>
      <text x="150" y="15" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«RepositoryImplementation»</text>
      <text x="150" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">OutboxRepoJPA</text>
      <line x1="0" y1="36" x2="300" y2="36" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="52" font-size="9" fill="#2D3748"># em: EntityManager</text>
      <line x1="0" y1="60" x2="300" y2="60" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="78" font-size="9" fill="#2D3748">+ save(message: OutboxMessage): void</text>
      <text x="10" y="96" font-size="9" fill="#2D3748">+ findPending(limit: int): List&lt;OutboxMessage&gt;</text>
      <text x="10" y="114" font-size="9" fill="#2D3748">+ markAsPublished(id: UUID, at: Instant): void</text>
      <text x="10" y="132" font-size="9" fill="#2D3748">+ deletePublishedOlderThan(days: int): int</text>
      <text x="10" y="150" font-size="8.5" font-style="italic" fill="#7A583A">/* Implements IOutboxRepository contract */</text>
    </g>

    <!-- OutboxDispatcher -->
    <g transform="translate(665, 38)">
      <rect x="0" y="0" width="270" height="220" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.5" filter="url(#shadow)" />
      <circle cx="16" cy="16" r="6" fill="#0EA5E9" />
      <text x="16" y="19" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">C</text>
      <text x="135" y="15" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«Component, BackgroundWorker»</text>
      <text x="135" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">OutboxDispatcher</text>
      <line x1="0" y1="36" x2="270" y2="36" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="52" font-size="9" fill="#2D3748">- outboxRepo: IOutboxRepository</text>
      <text x="10" y="68" font-size="9" fill="#2D3748">- rabbitTemplate: RabbitTemplate</text>
      <text x="10" y="84" font-size="9" fill="#2D3748">- exchangeName: String</text>
      <line x1="0" y1="92" x2="270" y2="92" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="110" font-size="9" fill="#2D3748">+ pollAndDispatch(): void</text>
      <text x="10" y="126" font-size="8.5" fill="#7A583A">  [@Scheduled(fixedDelay = 2000)]</text>
      <text x="10" y="144" font-size="8.5" fill="#7A583A">- publishSingle(msg: OutboxMessage)</text>
      <text x="10" y="160" font-size="8.5" fill="#7A583A">- logDispatchMetrics(count: int)</text>
    </g>
  </g>

  <!-- External Broker and Notes on Right -->
  <g transform="translate(1010, 80)">
    <rect x="0" y="0" width="480" height="230" rx="6" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.2" />
    <text x="14" y="22" font-size="12" font-weight="bold" fill="#4A5568">External Infrastructure: Message Broker</text>

    <!-- RabbitMQ Queue / Exchange -->
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="440" height="150" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.5" filter="url(#shadow)" />
      <circle cx="16" cy="16" r="6" fill="#F59E0B" />
      <text x="16" y="19" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">Q</text>
      <text x="220" y="15" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«AMQP Topic Exchange»</text>
      <text x="220" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">erasmus.events.topic</text>
      <line x1="0" y1="36" x2="440" y2="36" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="12" y="54" font-size="9" fill="#2D3748">Routing Key: "agreement.approved"</text>
      <text x="12" y="72" font-size="9" fill="#2D3748">Delivery Mode: PERSISTENT (2)</text>
      <text x="12" y="90" font-size="9" fill="#2D3748">Target Queue: "mobility.preparation.agreement.approved"</text>
      <text x="12" y="108" font-size="8.5" fill="#7A583A">Decoupled distribution to all downstream subscribers</text>
    </g>
  </g>

  <!-- Yellow Note at bottom right -->
  <g transform="translate(1010, 340)">
    <rect x="0" y="0" width="480" height="280" rx="4" fill="#FEFCBF" stroke="#D69E2E" stroke-width="1" />
    <path d="M 470 0 L 480 10 L 470 10 Z" fill="#B7791F" />
    <text x="16" y="24" font-size="10.5" font-weight="bold" fill="#744210">ACID Transactional Guarantees</text>
    <text x="16" y="48" font-size="9.5" fill="#744210">1. AgreementApplicationService runs inside a single database transaction.</text>
    <text x="16" y="70" font-size="9.5" fill="#744210">2. Aggregate mutation and OutboxMessage row are saved together.</text>
    <text x="16" y="92" font-size="9.5" fill="#744210">3. If database write fails, both rollback. No orphaned events exist.</text>
    <text x="16" y="114" font-size="9.5" fill="#744210">4. OutboxDispatcher polls table every 2000 ms using indexed status query.</text>
    <text x="16" y="136" font-size="9.5" fill="#744210">5. Messages are pushed to RabbitMQ topic with persistent delivery flags.</text>
    <text x="16" y="158" font-size="9.5" fill="#744210">6. Upon broker confirmation, message status transitions to PUBLISHED.</text>
    <text x="16" y="180" font-size="9.5" fill="#744210">7. Solves the dual-write problem cleanly without two-phase commit.</text>
    <text x="16" y="210" font-size="9" font-style="italic" fill="#8C5015">[Guarantees at-least-once cross-boundary asynchronous event delivery]</text>
  </g>

  <!-- Connectors -->
  <!-- AgreementApplicationService -> LearningAgreementApprovedEvent -->
  <line x1="490" y1="180" x2="535" y2="180" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <text x="495" y="172" font-size="8.5" fill="#2D3748">creates</text>

  <!-- AgreementApplicationService -> OutboxRepoJPA -->
  <line x1="300" y1="310" x2="430" y2="378" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <text x="320" y="340" font-size="8.5" fill="#2D3748">writes envelope</text>

  <!-- OutboxDispatcher -> OutboxRepoJPA -->
  <line x1="695" y1="460" x2="645" y2="460" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <text x="650" y="452" font-size="8.5" fill="#2D3748">polls</text>

  <!-- OutboxDispatcher -> RabbitMQ -->
  <line x1="935" y1="450" x2="1050" y2="235" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <text x="965" y="325" font-size="8.5" fill="#2D3748" font-weight="bold">publishes AMQP</text>
</svg>