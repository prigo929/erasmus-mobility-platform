  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1A202C">Figure 18. Consolidated Structural Solution: Mobility Preparation (Supporting Subdomain)</text>
  <text x="30" y="50" font-size="11.5" fill="#5A4A3E">Author: Schipor Ana-Maria. Complete Package Class Diagram: RabbitMQ Receiver, Checklist Application Service, and Idempotency Port</text>

  <!-- Presentation Layer -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="460" height="200" rx="6" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.2" />
    <text x="14" y="22" font-size="11.5" font-weight="bold" fill="#4A5568">Presentation: preparation.presentation</text>
    <g transform="translate(15, 35)">
      <rect x="0" y="0" width="430" height="145" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.5" filter="url(#shadow)" />
      <circle cx="16" cy="16" r="6" fill="#0EA5E9" />
      <text x="16" y="19" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">C</text>
      <text x="215" y="15" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«RestController»</text>
      <text x="215" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">MobilityChecklistWebController</text>
      <line x1="0" y1="36" x2="430" y2="36" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="52" font-size="8.5" fill="#2D3748">- preparationService: PreparationApplicationService</text>
      <line x1="0" y1="60" x2="430" y2="60" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="78" font-size="8.5" fill="#2D3748">+ getStudentChecklist(studentId: UUID): ResponseEntity</text>
      <text x="10" y="96" font-size="8.5" fill="#2D3748">+ completeTask(checklistId: UUID, taskId: UUID): ResponseEntity</text>
      <text x="10" y="114" font-size="8.5" fill="#2D3748">+ uploadTaskProof(taskId: UUID, file: MultipartFile): ResponseEntity</text>
    </g>
  </g>

  <!-- Application Layer -->
  <g transform="translate(520, 75)">
    <rect x="0" y="0" width="1010" height="200" rx="6" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.2" />
    <text x="14" y="22" font-size="11.5" font-weight="bold" fill="#4A5568">Application: preparation.application</text>
    <g transform="translate(15, 35)">
      <rect x="0" y="0" width="480" height="145" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.5" filter="url(#shadow)" />
      <circle cx="16" cy="16" r="6" fill="#0EA5E9" />
      <text x="16" y="19" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">C</text>
      <text x="240" y="15" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«ApplicationService, @Transactional»</text>
      <text x="240" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">PreparationApplicationService</text>
      <line x1="0" y1="36" x2="480" y2="36" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="52" font-size="8.5" fill="#2D3748">- checklistRepo: MobilityChecklistRepository</text>
      <text x="10" y="66" font-size="8.5" fill="#2D3748">- processedEventRepo: IProcessedEventRepository</text>
      <line x1="0" y1="74" x2="480" y2="74" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="90" font-size="8.5" fill="#2D3748">+ initializeChecklistFromApprovedAgreement(cmd): void</text>
      <text x="10" y="106" font-size="8.5" fill="#2D3748">+ markTaskComplete(checklistId: UUID, taskId: UUID): void</text>
      <text x="10" y="122" font-size="8.5" fill="#2D3748">+ attachDocumentProof(taskId: UUID, docRef: String): void</text>
    </g>
    <g transform="translate(520, 35)">
      <rect x="0" y="0" width="450" height="145" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.2" />
      <circle cx="14" cy="15" r="6" fill="#F59E0B" />
      <text x="14" y="18" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">D</text>
      <text x="225" y="14" text-anchor="middle" font-size="8.5" font-style="italic" fill="#7A583A">«DTO»</text>
      <text x="225" y="26" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1A202C">ChecklistSummaryDTO</text>
      <line x1="0" y1="32" x2="450" y2="32" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="8" y="48" font-size="8.5" fill="#2D3748">+ checklistId: UUID</text>
      <text x="8" y="64" font-size="8.5" fill="#2D3748">+ completedCount: int, pendingCount: int</text>
      <text x="8" y="80" font-size="8.5" fill="#2D3748">+ isReadyForDeparture: boolean</text>
      <text x="8" y="96" font-size="8.5" fill="#2D3748">+ overdueTasks: List&lt;String&gt;</text>
    </g>
  </g>

  <!-- Domain Layer: Checklist, Task, Status on top; Repositories side-by-side below -->
  <g transform="translate(30, 295)">
    <rect x="0" y="0" width="1500" height="350" rx="6" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.2" />
    <text x="14" y="22" font-size="11.5" font-weight="bold" fill="#4A5568">Domain Layer: preparation.domain</text>

    <!-- MobilityChecklist Aggregate Root -->
    <g transform="translate(20, 35)">
      <rect x="0" y="0" width="450" height="180" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.6" filter="url(#shadow)" />
      <circle cx="18" cy="18" r="7" fill="#EF4444" />
      <text x="18" y="22" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">A</text>
      <text x="225" y="16" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«AggregateRoot»</text>
      <text x="225" y="29" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A202C">MobilityChecklist</text>
      <line x1="0" y1="36" x2="450" y2="36" stroke="#8D5B4C" stroke-width="0.8" />
