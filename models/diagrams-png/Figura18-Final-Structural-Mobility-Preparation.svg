  <!-- Connectors -->
  <line x1="490" y1="175" x2="535" y2="175" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="512" y="167" font-size="8.5" font-weight="bold" fill="#2D3748" text-anchor="middle">delegates</text>

