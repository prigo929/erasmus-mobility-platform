      <text x="205" y="14" text-anchor="middle" font-size="8.5" font-style="italic" fill="#7A583A">«RepositoryImplementation»</text>
      <text x="205" y="26" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1A202C">MobilityChecklistRepoJPA</text>
      <line x1="0" y1="32" x2="410" y2="32" stroke="#8D5B4C" stroke-width="0.8" />
