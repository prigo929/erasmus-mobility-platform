      <line x1="0" y1="76" x2="450" y2="76" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="94" font-size="8.5" fill="#2D3748">+ initializeDefaultPreparationTasks(): void</text>
      <text x="10" y="112" font-size="8.5" fill="#2D3748">+ completeTask(taskId: TaskId): void</text>
      <text x="10" y="130" font-size="8.5" fill="#2D3748">+ areMandatoryTasksComplete(): boolean</text>
      <text x="10" y="148" font-size="8.5" fill="#2D3748">+ flagOverdueTasks(asOf: LocalDate): void</text>
    </g>

    <!-- ChecklistTask Entity -->
    <g transform="translate(510, 35)">
      <rect x="0" y="0" width="370" height="180" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" />
      <circle cx="16" cy="16" r="6" fill="#0EA5E9" />
      <text x="16" y="19" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">E</text>
      <text x="185" y="15" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«Entity»</text>
      <text x="185" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">ChecklistTask</text>
      <line x1="0" y1="36" x2="370" y2="36" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="52" font-size="8.5" fill="#2D3748">- taskId: TaskId, taskType: TaskType, title: String</text>
      <text x="10" y="68" font-size="8.5" fill="#2D3748">- status: TaskStatus, deadline: LocalDate</text>
      <line x1="0" y1="76" x2="370" y2="76" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="94" font-size="8.5" fill="#2D3748">+ markSubmitted(): void</text>
      <text x="10" y="112" font-size="8.5" fill="#2D3748">+ markCompleted(): void</text>
      <text x="10" y="130" font-size="8.5" fill="#2D3748">+ markOverdue(): void</text>
    </g>

    <!-- Composition line MobilityChecklist -> ChecklistTask -->
    <line x1="470" y1="100" x2="510" y2="100" stroke="#2D3748" stroke-width="1.4" marker-start="url(#diamond)" />
    <text x="490" y="92" font-size="8" fill="#2D3748" text-anchor="middle">1..*</text>

    <!-- TaskStatus Enum -->
    <g transform="translate(910, 35)">
      <rect x="0" y="0" width="180" height="150" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.2" />
      <circle cx="14" cy="15" r="6" fill="#EA580C" />
      <text x="14" y="18" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">E</text>
      <text x="95" y="14" text-anchor="middle" font-size="8.5" font-style="italic" fill="#7A583A">«Enum»</text>
      <text x="95" y="26" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1A202C">TaskStatus</text>
      <line x1="0" y1="32" x2="180" y2="32" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="46" font-size="8" fill="#2D3748">INITIALIZED</text>
      <text x="10" y="60" font-size="8" fill="#2D3748">PENDING_STUDENT_ACTION</text>
      <text x="10" y="74" font-size="8" fill="#2D3748">SUBMITTED_FOR_VERIFICATION</text>
      <text x="10" y="88" font-size="8" fill="#2D3748">COMPLETED | OVERDUE</text>
      <text x="10" y="102" font-size="8" fill="#2D3748">ABANDONED</text>
    </g>

    <!-- Domain Ports Row (Side by Side at bottom of Domain) -->
    <!-- MobilityChecklistRepository (x=510, y=235) -->
    <g transform="translate(510, 235)">
      <rect x="0" y="0" width="460" height="95" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.3" />
      <circle cx="14" cy="15" r="6" fill="#10B981" />
      <text x="14" y="18" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">I</text>
      <text x="230" y="14" text-anchor="middle" font-size="8.5" font-style="italic" fill="#7A583A">«interface, RepositoryPort»</text>
      <text x="230" y="26" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1A202C">MobilityChecklistRepository</text>
      <line x1="0" y1="32" x2="460" y2="32" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="48" font-size="8.5" fill="#2D3748">+ save(checklist: MobilityChecklist): void</text>
      <text x="10" y="64" font-size="8.5" fill="#2D3748">+ findByAgreementId(aid: UUID): Optional&lt;MobilityChecklist&gt;</text>
    </g>

    <!-- IProcessedEventRepository (x=1010, y=235) -->
    <g transform="translate(1010, 235)">
      <rect x="0" y="0" width="460" height="95" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.3" />
      <circle cx="14" cy="15" r="6" fill="#10B981" />
      <text x="14" y="18" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">I</text>
      <text x="230" y="14" text-anchor="middle" font-size="8.5" font-style="italic" fill="#7A583A">«interface, IdempotencyPort»</text>
      <text x="230" y="26" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1A202C">IProcessedEventRepository</text>
      <line x1="0" y1="32" x2="460" y2="32" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="10" y="48" font-size="8.5" fill="#2D3748">+ existsById(eventId: UUID): boolean</text>
      <text x="10" y="64" font-size="8.5" fill="#2D3748">+ recordEvent(eventId: UUID, at: Instant): void</text>
    </g>
  </g>

  <!-- Infrastructure Layer -->
  <g transform="translate(30, 685)">
    <rect x="0" y="0" width="1500" height="200" rx="6" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.2" />
    <text x="14" y="22" font-size="11.5" font-weight="bold" fill="#4A5568">Infrastructure Layer: preparation.infrastructure</text>

    <!-- AbstractRepositoryJPA -->
    <g transform="translate(20, 35)">
      <rect x="0" y="0" width="200" height="120" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" />
      <circle cx="14" cy="15" r="6" fill="#0EA5E9" />
      <text x="14" y="18" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">A</text>
