      <line x1="0" y1="32" x2="200" y2="32" stroke="#8D5B4C" stroke-width="0.8" />
      <text x="8" y="48" font-size="8.5" fill="#2D3748"># em: EntityManager</text>
      <text x="8" y="66" font-size="8.5" fill="#2D3748"># persist(T entity): void</text>
    </g>

    <!-- AgreementApprovedMessageReceiver -->
    <g transform="translate(240, 35)">
      <rect x="0" y="0" width="310" height="120" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" />
      <circle cx="14" cy="15" r="6" fill="#0EA5E9" />
      <text x="14" y="18" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">C</text>
      <text x="155" y="14" text-anchor="middle" font-size="8.5" font-style="italic" fill="#7A583A">«RabbitListener»</text>
      <text x="155" y="26" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A202C">AgreementApprovedMessageReceiver</text>
