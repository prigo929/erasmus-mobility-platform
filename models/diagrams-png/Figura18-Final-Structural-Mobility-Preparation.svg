      <text x="8" y="66" font-size="8.5" fill="#2D3748">+ onMessage(payload, tag, channel): void</text>
    </g>

    <!-- MobilityChecklistRepoJPA (Directly below MobilityChecklistRepository) -->
    <g transform="translate(580, 35)">
      <rect x="0" y="0" width="410" height="120" rx="4" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" />
      <circle cx="14" cy="15" r="6" fill="#0EA5E9" />
