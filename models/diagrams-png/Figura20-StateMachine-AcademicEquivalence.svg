2646" fill="none" style="stroke:#334155;stroke-width:1;"/></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0013" data-link-type="dependency" id="lnk15"><polygon fill="#334155" points="514.1332,560.4381,508.0648,552.6809,509.7185,558.0907,504.3088,559.7444,514.1332,560.4381" style="stroke:#334155;stroke-width:1;"/><path d="M430.2972,515.8587 C457.5526,530.3516 490.3045,547.7673 508.8356,557.6212" fill="none" style="stroke:#334155;stroke-width:1;"/></g><g class="legend" data-source-line="20"><rect fill="#FFF7DB" height="91.4844" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="588.6211" x="12" y="585.2969"/><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="427.499" x="17" y="603.292">UC02 starts in UNDER_EVALUATION and succeeds in ACTIVE.</text><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="561.3057" x="17" y="619.5889">Approval and publication form one operation; no intermediate APPROVED state.</text><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="466.0742" x="17" y="635.8857">isEligible(period) also checks the entire requested mobility period.</text><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="492.6729" x="17" y="652.1826">Expiration uses the agreed calendar. An expired rule is ineligible even</text><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="578.6211" x="17" y="668.4795">before the retirement job runs. Retiring it does not rewrite confirmed agreements.</text></g><?plantuml-src ZLJlJzim4FsUl-B69DHEK7wD3J4DARI9r6cZLLlw1T3asfVKuDZ1Tc3TNxzpqfHEC6dVOllTUtVlxlAkj2ml62YsCfK7Lw1dcaNkGUgIMLQ0m8nLogT6-ojM80pmdiqhc3BjtaPDvM-4e-EjHxTamZnBdKF6bCEj5sigBRYn6YryshgFhJNFVQECXVSd9n-FJa-twJppUCduGrw7hs7fMHgd_IsOmXorU8rBqy-3osWf1G8MfLzHxevRMNffTEIbLmYfp2kBS7pOWvWpWONaoMCbdvX2pH6Kp92lE04xF-IIoMvqy-4EzlSlO3mPZKVJP12r