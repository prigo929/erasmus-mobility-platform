<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 820" width="100%" height="100%" style="background-color: #FBF8F1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2D3748" />
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1A202C">Figure 5. Use Case Diagram - Mobility Preparation (Supporting Subdomain)</text>
  <text x="30" y="50" font-size="11.5" fill="#5A4A3E">Administrative Checklist Tracking, Official Document Verification, and Deadline Escalation</text>

  <!-- System Boundary Box -->
  <g transform="translate(230, 75)">
    <rect x="0" y="0" width="1000" height="700" rx="8" fill="#F7FAFC" stroke="#8D5B4C" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="1000" height="32" rx="8" fill="#FDF3E7" stroke="#8D5B4C" stroke-width="1" />
    <text x="500" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A3728">Mobility Preparation Bounded Context</text>

    <!-- Column 1: Student Actions (x = 200) -->
    <!-- P6: View Checklist -->
    <ellipse cx="200" cy="110" rx="110" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="200" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">View Checklist</text>

    <!-- P7: Mark Task Done -->
    <ellipse cx="200" cy="220" rx="110" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="200" y="224" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Mark Task Done</text>

    <!-- Column 2: System Extensions & Automation (x = 520) -->
    <!-- P8: Open Official Form -->
    <ellipse cx="520" cy="110" rx="120" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="520" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Open Official Form</text>

    <!-- P9: Send Deadline Reminder -->
    <ellipse cx="520" cy="220" rx="125" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="520" y="224" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Send Deadline Reminder</text>

    <!-- Column 3: Coordinator / Administrative Lifecycle (x = 800) -->
    <!-- P3: Manage Checklist Template -->
    <ellipse cx="800" cy="330" rx="135" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="800" y="334" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Manage Checklist Template</text>

    <!-- P1: Confirm Nomination -->
    <ellipse cx="800" cy="440" rx="120" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="800" y="444" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Confirm Nomination</text>

    <!-- P2: Generate Checklist -->
    <ellipse cx="800" cy="550" rx="120" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="800" y="554" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Generate Checklist</text>

    <!-- P4: Monitor Student Progress -->
    <ellipse cx="800" cy="640" rx="130" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="800" y="644" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Monitor Student Progress</text>

    <!-- P5: Flag Overdue Task -->
    <ellipse cx="520" cy="640" rx="120" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="520" y="644" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Flag Overdue Task</text>

    <!-- Relationships inside System Boundary -->
    <!-- P8 extends P6 -->
    <line x1="400" y1="110" x2="310" y2="110" stroke="#2D3748" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)" />
    <text x="355" y="102" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«extend»</text>

    <!-- Note on extend P8 ..> P6 -->
    <rect x="295" y="55" width="145" height="35" rx="3" fill="#FEFCBF" stroke="#D69E2E" stroke-width="0.8" />
    <text x="367" y="70" text-anchor="middle" font-size="8.5" fill="#744210">[task provides link</text>
    <text x="367" y="82" text-anchor="middle" font-size="8.5" fill="#744210">to official form]</text>

    <!-- P1 includes P2 -->
    <line x1="800" y1="466" x2="800" y2="524" stroke="#2D3748" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)" />
    <text x="825" y="498" font-size="9" font-style="italic" fill="#7A583A">«include»</text>

    <!-- P5 extends P4 -->
    <line x1="640" y1="640" x2="670" y2="640" stroke="#2D3748" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)" />
    <text x="655" y="632" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«extend»</text>

    <!-- Note on extend P5 ..> P4 -->
    <rect x="580" y="585" width="140" height="35" rx="3" fill="#FEFCBF" stroke="#D69E2E" stroke-width="0.8" />
    <text x="650" y="600" text-anchor="middle" font-size="8.5" fill="#744210">[task exceeded</text>
    <text x="650" y="612" text-anchor="middle" font-size="8.5" fill="#744210">scheduled deadline]</text>
  </g>

  <!-- ACTORS (Left) -->
  <!-- Actor 1: Student -->
  <g transform="translate(60, 140)">
    <circle cx="30" cy="14" r="10" fill="#FFF9F2" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="24" x2="30" y2="52" stroke="#2D3748" stroke-width="1.5" />
    <line x1="12" y1="34" x2="48" y2="34" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="16" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="44" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <text x="30" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">Student</text>
  </g>

  <!-- Actor 2: Scheduler (Timer) -->
  <g transform="translate(60, 480)">
    <circle cx="30" cy="14" r="10" fill="#FFF9F2" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="24" x2="30" y2="52" stroke="#2D3748" stroke-width="1.5" />
    <line x1="12" y1="34" x2="48" y2="34" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="16" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="44" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <text x="30" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">Scheduler</text>
    <text x="30" y="106" text-anchor="middle" font-size="9" fill="#7A583A">(Temporal Trigger)</text>
  </g>

  <!-- ACTORS (Right) -->
  <!-- Actor 3: Erasmus Office Coordinator (DRI) -->
  <g transform="translate(1320, 440)">
    <circle cx="30" cy="14" r="10" fill="#FFF9F2" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="24" x2="30" y2="52" stroke="#2D3748" stroke-width="1.5" />
    <line x1="12" y1="34" x2="48" y2="34" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="16" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="44" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <text x="30" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">Erasmus Office</text>
    <text x="30" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1A202C">Coordinator</text>
    <text x="30" y="118" text-anchor="middle" font-size="9" fill="#7A583A">(DRI Officer)</text>
  </g>

  <!-- Actor Connections -->
  <!-- Student -> P6, P7 -->
  <line x1="105" y1="180" x2="320" y2="185" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="105" y1="200" x2="320" y2="295" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />

  <!-- Scheduler -> P9, P5 -->
  <line x1="105" y1="510" x2="625" y2="295" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="105" y1="530" x2="630" y2="715" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />

  <!-- Coordinator -> P3, P1, P4 (Clean straight entry from right) -->
  <line x1="1320" y1="480" x2="1165" y2="405" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="1320" y1="495" x2="1150" y2="515" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="1320" y1="510" x2="1160" y2="715" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
</svg>