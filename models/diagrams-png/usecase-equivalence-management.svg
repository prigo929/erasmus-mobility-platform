<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 720" width="100%" height="100%" style="background-color: #FBF8F1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2D3748" />
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1A202C">Figure 4. Use Case Diagram - Equivalence Management (Supporting Subdomain)</text>
  <text x="30" y="50" font-size="11.5" fill="#5A4A3E">Academic Syllabus Verification, Historical Equivalence Ingestion, and ECTS Parity Enforcement</text>

  <!-- System Boundary Box -->
  <g transform="translate(230, 75)">
    <rect x="0" y="0" width="1000" height="600" rx="8" fill="#F7FAFC" stroke="#8D5B4C" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="1000" height="32" rx="8" fill="#FDF3E7" stroke="#8D5B4C" stroke-width="1" />
    <text x="500" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A3728">Equivalence Management Bounded Context</text>

    <!-- Column 1: Search & Inquiry Use Cases (x = 180) -->
    <!-- E1: Search Equivalences -->
    <ellipse cx="180" cy="90" rx="120" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="180" y="94" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Search Equivalences</text>

    <!-- E2: Compare ECTS & Syllabus -->
    <ellipse cx="180" cy="180" rx="125" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="180" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Compare ECTS &amp; Syllabus</text>

    <!-- Column 2: Management & Modification Use Cases (x = 520) -->
    <!-- E5: Import Historical Equivalences -->
    <ellipse cx="520" cy="135" rx="135" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="520" y="139" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Import Historical Equivalences</text>

    <!-- E3: Register Equivalence -->
    <ellipse cx="520" cy="270" rx="120" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="520" y="274" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Register Equivalence</text>

    <!-- E6: Approve Proposed Equivalence -->
    <ellipse cx="520" cy="380" rx="135" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="520" y="384" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Approve Proposed Equivalence</text>

    <!-- E7: Retire Equivalence -->
    <ellipse cx="520" cy="490" rx="120" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="520" y="494" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Retire Equivalence</text>

    <!-- Column 3: Invariant Validation (x = 830) -->
    <!-- E4: Validate ECTS Values -->
    <ellipse cx="830" cy="270" rx="120" ry="26" fill="#FFF9F2" stroke="#8D5B4C" stroke-width="1.4" filter="url(#shadow)" />
    <text x="830" y="274" text-anchor="middle" font-size="11" font-weight="600" fill="#1A202C">Validate ECTS Values</text>

    <!-- Relationships inside System Boundary -->
    <!-- E5 extends E3 -->
    <line x1="520" y1="161" x2="520" y2="244" stroke="#2D3748" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)" />
    <text x="548" y="205" font-size="9" font-style="italic" fill="#7A583A">«extend»</text>

    <!-- Note on extend E5 ..> E3 -->
    <rect x="585" y="185" width="130" height="30" rx="3" fill="#FEFCBF" stroke="#D69E2E" stroke-width="0.8" />
    <text x="650" y="204" text-anchor="middle" font-size="8.5" fill="#744210">[bulk data import]</text>

    <!-- E3 includes E4 -->
    <line x1="640" y1="270" x2="710" y2="270" stroke="#2D3748" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)" />
    <text x="675" y="262" text-anchor="middle" font-size="9" font-style="italic" fill="#7A583A">«include»</text>
  </g>

  <!-- ACTORS (Left) -->
  <!-- Actor 1: Student -->
  <g transform="translate(60, 160)">
    <circle cx="30" cy="14" r="10" fill="#FFF9F2" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="24" x2="30" y2="52" stroke="#2D3748" stroke-width="1.5" />
    <line x1="12" y1="34" x2="48" y2="34" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="16" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="44" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <text x="30" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">Student</text>
  </g>

  <!-- ACTORS (Right) -->
  <!-- Actor 2: Home Academic Coordinator -->
  <g transform="translate(1330, 340)">
    <circle cx="30" cy="14" r="10" fill="#FFF9F2" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="24" x2="30" y2="52" stroke="#2D3748" stroke-width="1.5" />
    <line x1="12" y1="34" x2="48" y2="34" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="16" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <line x1="30" y1="52" x2="44" y2="76" stroke="#2D3748" stroke-width="1.5" />
    <text x="30" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">Home Academic</text>
    <text x="30" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1A202C">Coordinator</text>
  </g>

  <!-- Actor to Use Case Connections -->
  <!-- Student -> E1, E2 -->
  <line x1="105" y1="185" x2="295" y2="165" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="105" y1="205" x2="295" y2="250" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />

  <!-- Home Academic Coordinator -> E5, E3, E6, E7 (Enters clean right side) -->
  <line x1="1330" y1="365" x2="880" y2="210" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="1330" y1="380" x2="870" y2="345" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="1330" y1="395" x2="880" y2="455" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="1330" y1="410" x2="865" y2="565" stroke="#2D3748" stroke-width="1.4" marker-end="url(#arrow)" />
</svg>