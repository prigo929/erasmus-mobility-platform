spring.application.name=erasmus-mobility-platform
spring.datasource.url=${EMP_DATABASE_URL:jdbc:h2:file:./data/erasmus}
spring.datasource.username=${EMP_DATABASE_USER:sa}
spring.datasource.password=${EMP_DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
server.port=${SERVER_PORT:8080}
platform.outbox.poll-ms=${OUTBOX_POLL_MS:1000}
spring.jackson.serialization.write-dates-as-timestamps=false
